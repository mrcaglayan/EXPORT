  /api/v1/entities/{entityId}/inventory/allocation-preview:
    parameters:
      - $ref: '#/components/parameters/InventoryEntity'
    get:
      summary: Preview destination then GENERAL availability
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      description: >-
        Requires workspace.read and inventory.read, in an assigned entity. Advisory current eligible
        stock, not a reservation or historical balance. Never includes another country
        automatically. Excludes layers with later-dated movements. Availability subtracts all
        outstanding reservations. Destination stock is selected first, then GENERAL, each in FIFO
        order. It never silently borrows from another country.
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: skuId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: toPoolId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: quantity
          in: query
          required: true
          schema:
            type: string
            pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
        - name: postingDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationPreview'
        default:
          description: >-
            400 validation/idempotency key; 401 unauthenticated; 403 scope, permission, CSRF,
            independent reviewer or requester required; 404 inaccessible reference; 409 invalid
            state, duplicate reference, idempotency conflict, inactive reference, closed period,
            insufficient eligible stock or movement effect; 422 quantity precision, period or
            destination; 413 payload too large; 500 sanitized failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
