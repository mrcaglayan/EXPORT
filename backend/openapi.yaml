  responses:
    Profile:
      description: >-
        Identity and current entity permissions; activeEntity may be null when no access is
        assigned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile'
    Organization:
      description: Authorized legal entity.
      content:
        application/json:
          schema:
            type: object
            required:
              - organization
              - requestId
            properties:
              organization:
                $ref: '#/components/schemas/Organization'
              requestId:
                type: string
    AuthError:
      description: |
        400 invalid input; 401 missing/expired/revoked session or invalid credentials;
        403 forbidden scope, invalid CSRF or Origin; 404 entity not accessible;
        415 JSON required; 429 login limited; 503 auth not configured; 500 unexpected failure.
        Responses include X-Request-Id and never expose SQL, hashes or tokens.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrigin:
      description: Browser origin is outside the configured allowlist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown API routes return 404 with this error shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Malformed JSON returns 400 with code INVALID_JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: JSON bodies over 1 MB return 413 with code PAYLOAD_TOO_LARGE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
