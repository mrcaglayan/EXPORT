  /api/v1/entities/{entityId}/inventory/trial-balance:
    parameters:
      - $ref: '#/components/parameters/InventoryEntity'
    get:
      summary: Read period stock trial balance
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      description: >-
        Requires workspace.read and inventory.read in the assigned entity. Defaults to the current
        approved snapshot if closed; otherwise a consistent live report. snapshotId selects a retained
        version in this period, including superseded/rejected versions. Opening uses the last valid
        approved snapshot plus intervening movements; incoming/outgoing and closing show quantity AND
        base-currency value. Group by layer, SKU, family, warehouse or pool; different base units
        remain separate. Pool grouping/filter requires POOL grain. Summary stockValue is entity-wide;
        filteredClosingValue reflects the chosen view. Financial details are excluded. Reservation
        dates and dispatch posting dates are business dates; release effectiveness uses recorded UTC
        timestamps at period end.
      parameters:
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: snapshotId
          in: query
          schema:
            type: string
            format: uuid
        - name: grain
          in: query
          schema:
            type: string
            enum:
              - PHYSICAL
              - POOL
            default: PHYSICAL
        - name: groupBy
          in: query
          schema:
            type: string
            enum:
              - layer
              - sku
              - family
              - warehouse
              - pool
            default: layer
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
        - name: skuId
          in: query
          schema:
            type: string
            format: uuid
        - name: familyId
          in: query
          schema:
            type: string
            format: uuid
        - name: poolId
          in: query
          schema:
            type: string
            format: uuid
        - name: layerId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockTrialBalanceRow'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  filteredClosingValue:
                    type: string
                    pattern: ^-?(0|[1-9][0-9]{0,23})(\.[0-9]{1,6})?$
                    description: >-
                      Exact decimal string; six fractional places in stock reports. Aggregated values
                      may exceed a single document amount.
                  summary:
                    $ref: '#/components/schemas/StockCloseSummary'
                  period:
                    $ref: '#/components/schemas/StockClosePeriod'
                  snapshot:
                    type: object
                    additionalProperties: false
