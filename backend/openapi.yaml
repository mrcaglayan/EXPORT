            schema:
              type: object
              additionalProperties: false
              required:
                - legalEntityId
              properties:
                legalEntityId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        default:
          $ref: '#/components/responses/AuthError'
  /api/v1/me:
    get:
      operationId: getCurrentIdentity
      summary: Read the current user, tenant, assigned entities and active entity permissions.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
