    post:
      operationId: postFixtureStockReceipt
      summary: Post a receipt from a disposable test fixture
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      description: >-
        PR-02B test harness only: registered only with NODE_ENV=test and matching
        PR00_TEST_DATABASE/DB_NAME disposable-schema identity. Absent (404) in the normal app.
        Requires inventory.receipt.post, session CSRF and Idempotency-Key. PR-03 must add an
        authorized purchase source adapter before live receipt writes. Validates both open periods,
        active references, RECEIPT effect, SKU precision and pool quantity conservation. Line cost
        rounds half-up to six places; largest-remainder allocation reconciles pool values. No GL or
        VAT posting. Replays the same key/source exactly; changed content conflicts.
      parameters:
        - $ref: '#/components/parameters/InventoryEntity'
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReceiptInput'
      responses:
        '200':
          description: Posted or replayed receipt
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  receipt:
                    $ref: '#/components/schemas/StockReceipt'
                  requestId:
                    type: string
                    maxLength: 128
                required:
                  - receipt
                  - requestId
        '409':
          description: >-
            Idempotency/source conflict, closed period, inactive reference, movement effect mismatch
            or accounting not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Invalid amount/quantity, overflow, allocation mismatch, SKU precision, missing period or
            currency mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: >-
            400 invalid fields, dates, identifiers or idempotency key; 401 unauthenticated; 403
            scope/permission/CSRF/Origin or source unavailable; 404 route absent outside disposable
            tests or inaccessible reference; 413 payload too large; 500 sanitized failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
