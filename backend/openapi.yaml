  /api/v1/entities/{entityId}/products/alias-matches:
    parameters:
      - $ref: '#/components/parameters/ProductEntity'
    post:
      operationId: matchProductAlias
      summary: Check an exact verified supplier mapping without mutation.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      description: >-
        Requires workspace.read and products.read in the explicit entity. Read-only POST avoids
        sending original supplier text in query URLs. Requires JSON, allowed Origin and CSRF; no
        idempotency key required. Exact supplier+code+description only, with active supplier/SKU and
        VERIFIED revision. Never fuzzy/GTIP/VAT/country matching. Returns null when there is no
        eligible exact match.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAliasMatchInput'
      responses:
        '200':
          description: Successful scoped operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      sourceId:
                        type: string
                        format: uuid
                      revision:
                        type: integer
                        minimum: 1
                      skuId:
                        type: string
                        format: uuid
                      skuCode:
                        type: string
                        minLength: 1
                        maxLength: 40
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                      supplierId:
                        type: string
                        format: uuid
                      supplierCode:
                        type: string
                        minLength: 0
                        maxLength: 120
                        description: Original code, exact case/whitespace. Empty allowed.
                      supplierDescription:
                        type: string
                        minLength: 1
                        maxLength: 1000
                        description: >-
                          Original wording preserved, including whitespace and line breaks. Must
                          contain non-whitespace text.
                      supplierReferenceCode:
                        type: string
                        minLength: 1
                        maxLength: 40
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                      supplierName:
                        type: string
                        minLength: 0
                        maxLength: 160
                      status:
                        type: string
                        enum:
                          - PENDING
                          - REVIEWED
                          - VERIFIED
                          - REJECTED
                          - RETIRED
                      sourceReference:
                        type: string
                        minLength: 0
                        maxLength: 1000
                      createdBy:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
                      reviewedBy:
                        type: string
                        format: uuid
                        nullable: true
                      reviewedAt:
                        type: string
                        format: date-time
                        nullable: true
                      verifiedBy:
                        type: string
                        format: uuid
                        nullable: true
                      verifiedAt:
                        type: string
                        format: date-time
                        nullable: true
                    required:
                      - id
                      - sourceId
                      - revision
                      - skuId
                      - skuCode
                      - supplierId
                      - supplierCode
                      - supplierDescription
                      - supplierReferenceCode
                      - supplierName
                      - status
                      - sourceReference
                      - createdBy
                      - createdAt
                      - reviewedBy
                      - reviewedAt
                      - verifiedBy
                      - verifiedAt
                    nullable: true
                  requestId:
                    type: string
                    minLength: 0
                    maxLength: 100
                required:
                  - match
                  - requestId
        default:
          description: >-
            400 validation or missing idempotency key; 401 unauthenticated; 403
            assignment/permission/Origin/CSRF; 404 inaccessible record; 409 duplicate, idempotency
            conflict, inactive reference, STOCK_IDENTITY_LOCKED, GTIP_OVERLAP, INVALID_TRANSITION,
            GTIP_DATE_RANGE, ALIAS_ALREADY_ACTIVE or ambiguous match; 413 request too large; 500
            sanitized failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
