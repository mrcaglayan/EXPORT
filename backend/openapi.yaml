          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  reopen:
                    $ref: '#/components/schemas/StockReopen'
                  requestId:
                    type: string
                    maxLength: 128
                required:
                  - reopen
                  - requestId
        default:
          description: >-
            400 invalid fields or idempotency key; 401 unauthenticated; 403 scope, permission, CSRF,
            Origin or independent reviewer required; 404 inaccessible period/snapshot/reference; 409
            invalid state, stale snapshot/reopen, reconciliation failure, earlier period open, pending
            reopen, locked mapping or retry conflict; 422 unavailable asset account; 413 payload too
