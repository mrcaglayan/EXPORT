openapi: 3.0.3
info:
  title: Export Accounting API
  version: 0.8.0
  description: >-
    PR-00B identity and scoped access, plus foundation health/readiness.

    Auth responses are no-store. Session cookies are HttpOnly, SameSite=Strict,

    Path=/; production uses Secure and __Host- names. Login requires a workspace

    code and email. JWTs expire after the configured interval (8 hours by default)

    and require a live database session; logout revokes that session.

    Every write requires an allowed Origin, JSON and a session-bound CSRF token.

    GET /api/v1/auth/csrf before writing, retaining cookies. No automatic signup.


    PR-00C adds entity-scoped accounting, decimal strings, balanced immutable journals,
    audit/idempotency and a durable posting-request boundary. No inventory, tax or exchange-rate
    policy is implemented.

    PR-01A adds scoped units, hierarchical families and stockable SKUs. No inventory quantities are
    created.

    PR-01B adds typed SKU specifications, broker-verification records for GTIP history and exact
    versioned supplier aliases. A format-valid GTIP is not a classification decision. No tax rates
    or invoice imports are implemented.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check HTTP process liveness without requiring a database.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: HTTP service is running.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ready:
    get:
      operationId: getReadiness
      summary: Check database connectivity and the registered schema version.
      description: >-
        Read-only; never runs migrations. Returns 503 if configuration, database or schema is
        unavailable.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Database and migration history are ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DATABASE_UNAVAILABLE or SCHEMA_NOT_READY; no database details are exposed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get a signed CSRF token and matching HttpOnly cookie.
      description: Available before login; bound to the session after login. Expires after one hour.
      responses:
        '200':
          description: Retain the cookie and send csrfToken as X-CSRF-Token on writes.
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                  - requestId
                properties:
                  csrfToken:
                    type: string
                  requestId:
                    type: string
        default:
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in to a workspace and replace the current session.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantCode
                - email
                - password
              properties:
                tenantCode:
                  type: string
                  maxLength: 40
                  example: ABC
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: admin@example.test
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: At most 72 UTF-8 bytes.
      responses:
        '200':
          description: Signed in; session and rotated CSRF cookies set. No bearer token in JSON.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Profile'
                  - type: object
                    required:
                      - csrfToken
                    properties:
                      csrfToken:
                        type: string
        '429':
          description: >-
            Persistent 15-minute limits (20 per workspace/email and 100 per peer IP). Retry-After is
            900 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session and clear its cookies.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example: {}
      responses:
        '204':
          description: Session revoked.
        default:
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/context:
    post:
      operationId: selectLegalEntity
      summary: Select an assigned legal entity for this session.
      description: Requires workspace.read on the target entity. No tenant-wide role shortcut.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
