        403 forbidden scope, invalid CSRF or Origin; 404 entity not accessible;
        415 JSON required; 429 login limited; 503 auth not configured; 500 unexpected failure.
        Responses include X-Request-Id and never expose SQL, hashes or tokens.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
