  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List active assigned entities with workspace.read and organizations.read.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Paginated entities from the authenticated tenant only.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - offset
                  - limit
                  - requestId
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
                  requestId:
                    type: string
        default:
          $ref: '#/components/responses/AuthError'
  /api/v1/organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOrganization
      summary: Read an assigned entity with organizations.read.
      description: Returns 404 for another tenant or an unassigned entity.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        default:
          $ref: '#/components/responses/AuthError'
    patch:
      operationId: updateOrganization
      summary: Update an assigned entity name with organizations.update.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                  example: Example Company
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        default:
          $ref: '#/components/responses/AuthError'
  /api/v1/entities/{entityId}/accounting/settings:
    parameters:
      - $ref: '#/components/parameters/AccountingEntity'
    get:
      operationId: getAccountingSettings
      summary: Read entity accounting configuration.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      description: >-
        Requires workspace.read and accounting.read for this entity. Results are scoped to the
        entity; no caller-supplied tenant is accepted.
      responses:
        '200':
          description: Successful scoped operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    nullable: true
                    properties:
                      baseCurrency:
                        type: string
                        enum:
                          - TRY
                          - USD
                          - EUR
                          - GBP
                    required:
                      - baseCurrency
                  requestId:
                    type: string
                required:
                  - settings
                  - requestId
        default:
          description: >-
            400 invalid input/missing idempotency key; 401 unauthenticated; 403 scope/CSRF/Origin;
            404 inaccessible record; 409 state/idempotency/source conflict; 422 amount/date/currency
            validation; 500 sanitized failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: configureAccounting
      summary: Set the fixed base currency once.
      security:
        - SessionCookie: []
        - ProductionSessionCookie: []
      description: >-
        Requires workspace.read and accounting.configure for this entity. Writes require JSON,
        allowed Origin, CSRF and Idempotency-Key. Audit and idempotency commit with the change.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseCurrency:
                  type: string
                  enum:
                    - TRY
                    - USD
                    - EUR
                    - GBP
              required:
                - baseCurrency
              additionalProperties: false
      responses:
        '200':
          description: Successful scoped operation.
          content:
