            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                      - MATCHED
                      - MISMATCH
                  checks:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        grain:
                          type: string
                          enum:
                            - PHYSICAL
                            - POOL
                            - LAYER_POOLS
                            - RESERVATIONS
                        checked:
                          type: integer
                        invalid:
                          type: integer
                      required:
                        - grain
                        - checked
                        - invalid
                  requestId:
                    type: string
                    maxLength: 100
                required:
                  - status
                  - checks
                  - requestId
        '400':
          description: Structured validation, access, state or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Structured validation, access, state or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Structured validation, access, state or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Structured validation, access, state or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Structured validation, access, state or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Structured validation, access, state or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Structured validation, access, state or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: export_session
    ProductionSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-export_session
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token returned by /api/v1/auth/csrf; requires its matching cookie.
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact configured HTTP(S) origin; cross-site writes are rejected.
      schema:
        type: string
        example: http://localhost:5173
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: A safe identifier is echoed; missing or invalid values are replaced with a generated UUID.
      schema:
        type: string
        maxLength: 100
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$
    AccountingEntity:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        Explicit entity; backend permissions are checked independently of the selected browser
        context.
    AccountingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: >-
        Retain on retry after unknown outcomes. Bound to normalized payload, operation, actor and
        entity. Reuse with different content returns 409. Records do not expire.
    ProductEntity:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Explicit assigned entity; tenant comes from the authenticated identity.
    InventoryEntity:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Explicit assigned entity; tenant comes from the authenticated identity.
  headers:
    RequestId:
      description: Identifier also included in the response body.
      schema:
        type: string
        maxLength: 100
  schemas:
    Organization:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: MAIN
        name:
          type: string
          example: Example Company
    Profile:
      type: object
      required:
        - user
        - tenant
        - entities
        - activeEntity
        - permissions
        - requestId
      properties:
        user:
          type: object
          required:
            - id
            - email
            - displayName
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            displayName:
              type: string
        tenant:
          $ref: '#/components/schemas/Organization'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        activeEntity:
          type: object
          nullable: true
          required:
            - id
            - code
            - name
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
        permissions:
          type: array
          items:
            type: string
            example: workspace.read
        requestId:
          type: string
    Health:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - requestId
      properties:
        service:
          type: string
          enum:
            - export-accounting-api
        status:
          type: string
          enum:
            - ok
        requestId:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
        - requestId
      properties:
        status:
          type: string
          enum:
            - ready
        requestId:
          type: string
        checks:
          type: object
          additionalProperties: false
          required:
            - database
            - schema
          properties:
            database:
              type: string
              enum:
                - up
            schema:
              type: string
              enum:
                - current
    Error:
      type: object
      additionalProperties: false
      required:
        - error
        - requestId
      properties:
        requestId:
          type: string
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
                - INVALID_JSON
                - PAYLOAD_TOO_LARGE
                - ORIGIN_NOT_ALLOWED
                - ORIGIN_REQUIRED
                - DATABASE_UNAVAILABLE
                - SCHEMA_NOT_READY
                - INTERNAL_ERROR
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - CSRF_INVALID
                - JSON_REQUIRED
                - VALIDATION_ERROR
                - LOGIN_RATE_LIMITED
                - AUTH_NOT_CONFIGURED
                - INVALID_AMOUNT
                - UNSUPPORTED_CURRENCY
                - IDEMPOTENCY_KEY_REQUIRED
                - IDEMPOTENCY_CONFLICT
                - UNBALANCED_JOURNAL
                - INVALID_JOURNAL_LINE
                - DUPLICATE_CODE
                - ACCOUNTING_NOT_CONFIGURED
                - CURRENCY_LOCKED
                - DATE_OVERLAP
                - PERIOD_OUTSIDE_YEAR
                - UNPOSTED_REQUESTS
                - UNPOSTED_JOURNALS
                - CURRENCY_MISMATCH
                - PERIOD_NOT_FOUND
                - PERIOD_CLOSED
                - ACCOUNT_UNAVAILABLE
                - SOURCE_CONFLICT
            message:
              type: string
              description: Safe user-facing message; never SQL, credentials or stack traces.
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      example: '123.450000'
      description: >-
        Nonnegative decimal string, never a JSON number. At most DECIMAL(20,6); responses have six
        fractional digits.
    AccountingSettings:
      type: object
      properties:
        baseCurrency:
          type: string
          enum:
            - TRY
            - USD
            - EUR
            - GBP
      required:
        - baseCurrency
    AccountInput:
      type: object
      properties:
        code:
          type: string
          maxLength: 40
          example: '100.01'
        name:
          type: string
          maxLength: 160
        accountType:
          type: string
          enum:
            - ASSET
            - LIABILITY
            - EQUITY
            - INCOME
            - EXPENSE
      required:
        - code
        - name
        - accountType
      additionalProperties: false
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 40
          example: '100.01'
        name:
          type: string
          maxLength: 160
        accountType:
          type: string
          enum:
            - ASSET
            - LIABILITY
            - EQUITY
            - INCOME
            - EXPENSE
        active:
          type: boolean
      required:
        - id
        - code
        - name
        - accountType
        - active
    AccountUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        active:
          type: boolean
      required:
        - name
        - active
      additionalProperties: false
    FiscalYearInput:
      type: object
      properties:
        code:
          type: string
          example: FY2026
        startDate:
          type: string
          format: date
          example: '2026-01-01'
        endDate:
          type: string
          format: date
          example: '2026-12-31'
      required:
        - code
        - startDate
        - endDate
      additionalProperties: false
    FiscalYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: FY2026
        startDate:
          type: string
          format: date
          example: '2026-01-01'
        endDate:
          type: string
          format: date
          example: '2026-12-31'
      required:
        - id
        - code
        - startDate
        - endDate
    PeriodInput:
      type: object
      properties:
        code:
          type: string
          example: FY2026
        startDate:
          type: string
          format: date
          example: '2026-01-01'
        endDate:
          type: string
          format: date
          example: '2026-12-31'
        fiscalYearId:
          type: string
          format: uuid
      required:
        - code
        - startDate
        - endDate
        - fiscalYearId
      additionalProperties: false
    AccountingPeriod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: FY2026
        startDate:
          type: string
          format: date
          example: '2026-01-01'
        endDate:
          type: string
          format: date
          example: '2026-12-31'
        fiscalYearId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
      required:
        - id
        - code
        - startDate
        - endDate
        - fiscalYearId
        - status
    JournalLineInput:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 255
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
      required:
        - accountId
        - debit
        - credit
      additionalProperties: false
    JournalInput:
      type: object
      properties:
        documentDate:
          type: string
          format: date
          description: Source document date; may differ from posting date.
        postingDate:
          type: string
          format: date
          description: Determines the open accounting period.
        currency:
          type: string
          enum:
            - TRY
            - USD
            - EUR
            - GBP
        description:
          type: string
          maxLength: 255
        sourceModule:
          type: string
          maxLength: 40
          example: MANUAL
        sourceId:
          type: string
          maxLength: 128
          example: client-generated-document-uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLineInput'
          minItems: 2
      required:
        - documentDate
        - postingDate
        - currency
        - description
        - sourceModule
        - sourceId
        - lines
      additionalProperties: false
      description: >-
        Each line has exactly one positive side. Exact debit/credit sums must match and fit
        DECIMAL(20,6). Source identity is unique per entity. Only the entity base currency is
        accepted.
    Journal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
        documentDate:
          type: string
          format: date
          description: Source document date; may differ from posting date.
        postingDate:
          type: string
          format: date
          description: Determines the open accounting period.
        currency:
          type: string
          enum:
            - TRY
            - USD
            - EUR
            - GBP
        description:
          type: string
          maxLength: 255
        sourceModule:
          type: string
          maxLength: 40
          example: MANUAL
        sourceId:
          type: string
          maxLength: 128
          example: client-generated-document-uuid
        lines:
          type: array
          items:
            type: object
            properties:
              lineNumber:
                type: integer
              accountId:
                type: string
                format: uuid
              description:
                type: string
                maxLength: 255
              debit:
                $ref: '#/components/schemas/Money'
              credit:
                $ref: '#/components/schemas/Money'
            required:
              - lineNumber
              - accountId
              - description
              - debit
              - credit
        status:
          type: string
          enum:
            - POSTED
        totalDebit:
          $ref: '#/components/schemas/Money'
        totalCredit:
          $ref: '#/components/schemas/Money'
      required:
        - id
        - periodId
        - documentDate
        - postingDate
        - currency
        - description
        - sourceModule
        - sourceId
        - status
        - totalDebit
        - totalCredit
    PostingRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceModule:
          type: string
        sourceId:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - FAILED
            - POSTED
        journalId:
          type: string
          format: uuid
          nullable: true
        errorCode:
          type: string
          nullable: true
        attempts:
          type: integer
          minimum: 0
        payload:
          $ref: '#/components/schemas/JournalInput'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sourceModule
        - sourceId
        - status
        - journalId
        - errorCode
        - attempts
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        action:
          type: string
        resourceId:
          type: string
          format: uuid
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - actorId
        - action
        - resourceId
        - requestId
        - details
        - createdAt
    ProductUnitInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          maxLength: 160
          minLength: 1
        symbol:
          type: string
          maxLength: 16
          minLength: 1
        quantityPrecision:
          type: integer
          minimum: 0
          maximum: 6
      required:
        - code
        - name
        - symbol
        - quantityPrecision
      additionalProperties: false
      example:
        code: EA
        name: Adet
        symbol: ad
        quantityPrecision: 0
    ProductUnitUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 1
        active:
          type: boolean
        symbol:
          type: string
          maxLength: 16
          minLength: 1
      required:
        - name
        - active
        - symbol
      additionalProperties: false
    ProductUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          maxLength: 160
          minLength: 1
        symbol:
          type: string
          maxLength: 16
          minLength: 1
        quantityPrecision:
          type: integer
          minimum: 0
          maximum: 6
        active:
          type: boolean
      required:
        - id
        - code
        - name
        - symbol
        - quantityPrecision
        - active
    ProductFamilyInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          maxLength: 160
          minLength: 1
        parentId:
          type: string
          format: uuid
          nullable: true
      required:
        - code
        - name
      additionalProperties: false
      example:
        code: ZARF
        name: Zarf
        parentId: null
    ProductFamilyUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 1
        active:
          type: boolean
        parentId:
          type: string
          format: uuid
          nullable: true
      required:
        - name
        - active
      additionalProperties: false
    ProductFamily:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          maxLength: 160
          minLength: 1
        parentId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        parentCode:
          type: string
          maxLength: 40
          nullable: true
      required:
        - id
        - code
        - name
        - parentId
        - active
        - parentCode
    ProductSkuInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          maxLength: 160
          minLength: 1
        description:
          type: string
          maxLength: 1000
          default: ''
        familyId:
          type: string
          format: uuid
        baseUnitId:
          type: string
          format: uuid
      required:
        - code
        - name
        - familyId
        - baseUnitId
      additionalProperties: false
      example:
        code: ZARF-A4
        name: A4 zarf
        description: Example SKU
        familyId: 00000000-0000-4000-8000-000000000001
        baseUnitId: 00000000-0000-4000-8000-000000000002
    ProductSkuUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 1
        active:
          type: boolean
        description:
          type: string
          maxLength: 1000
          default: ''
        familyId:
          type: string
          format: uuid
      required:
        - name
        - active
        - familyId
      additionalProperties: false
    ProductSku:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          maxLength: 160
          minLength: 1
        description:
          type: string
          maxLength: 1000
          default: ''
        familyId:
          type: string
          format: uuid
        baseUnitId:
          type: string
          format: uuid
        active:
          type: boolean
        familyCode:
          type: string
          maxLength: 40
        baseUnitCode:
          type: string
          maxLength: 40
      required:
        - id
        - code
        - name
        - description
        - familyId
        - baseUnitId
        - active
        - familyCode
        - baseUnitCode
    ProductSupplierInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          minLength: 1
          maxLength: 160
      required:
        - code
        - name
      additionalProperties: false
      example:
        code: SUP-EXAMPLE
        name: Example supplier
    ProductSupplierUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        active:
          type: boolean
      required:
        - name
        - active
      additionalProperties: false
    ProductSupplier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          minLength: 1
          maxLength: 160
        active:
          type: boolean
      required:
        - id
        - code
        - name
        - active
    ProductDefinitionInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          minLength: 1
          maxLength: 160
        dataType:
          type: string
          enum:
            - TEXT
            - DECIMAL
            - BOOLEAN
        unitLabel:
          type: string
          minLength: 0
          maxLength: 16
        definesStock:
          type: boolean
      required:
        - code
        - name
        - dataType
        - definesStock
      additionalProperties: false
      example:
        code: SIZE
        name: Paper size
        dataType: TEXT
        unitLabel: ''
        definesStock: true
    ProductDefinitionUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        active:
          type: boolean
      required:
        - name
        - active
      additionalProperties: false
    ProductDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          minLength: 1
          maxLength: 160
        dataType:
          type: string
          enum:
            - TEXT
            - DECIMAL
            - BOOLEAN
        unitLabel:
          type: string
          minLength: 0
          maxLength: 16
        definesStock:
          type: boolean
        active:
          type: boolean
      required:
        - id
        - code
        - name
        - dataType
        - unitLabel
        - definesStock
        - active
    ProductAttributeInput:
      type: object
      properties:
        definitionId:
          type: string
          format: uuid
        value:
          oneOf:
            - type: string
              maxLength: 1000
            - type: boolean
          description: >-
            TEXT is trimmed nonempty text. DECIMAL must be a string: optional minus, up to 14
            integer and 6 fractional digits, no exponent or rounding; responses use six places.
            BOOLEAN must be JSON true/false.
      required:
        - definitionId
        - value
      additionalProperties: false
      example:
        definitionId: 00000000-0000-4000-8000-000000000001
        value: A4
    ProductAttribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        value:
          oneOf:
            - type: string
              maxLength: 1000
            - type: boolean
          description: >-
            TEXT is trimmed nonempty text. DECIMAL must be a string: optional minus, up to 14
            integer and 6 fractional digits, no exponent or rounding; responses use six places.
            BOOLEAN must be JSON true/false.
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        name:
          type: string
          minLength: 0
          maxLength: 160
        dataType:
          type: string
          enum:
            - TEXT
            - DECIMAL
            - BOOLEAN
        unitLabel:
          type: string
          minLength: 0
          maxLength: 16
